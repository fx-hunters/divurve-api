name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# 같은 PR/브랜치에 새 커밋이 오면 진행 중이던 이전 실행을 취소한다.
# main/develop 은 머지 이력이 곧 배포 이력이므로 취소하지 않는다 — 어느 머지가 깨뜨렸는지 추적해야 한다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

jobs:
  # 마이그레이션 순서 검사 (이슈 #104).
  #
  # build 잡과 분리한 이유는 이 검사만 base 브랜치와의 '비교' 가 필요해서다 — 리포 안의 파일만
  # 보는 테스트로는 판정할 수 없다. Testcontainers 는 매번 빈 DB 에 V1 부터 적용하므로 번호가
  # 순서를 어겨도 통과한다. 그 사각지대에서 2026-09-07 배포가 죽었다.
  migration-order:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 전체 이력을 받아야 base 브랜치를 비교할 수 있다 (기본 depth=1 로는 불가).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve base ref
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          else
            # push 이벤트: 이 push 직전 상태와 비교한다. 첫 커밋이면 비교 대상이 없어 건너뛴다.
            echo "ref=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Flyway migration ordering
        run: |
          BASE='${{ steps.base.outputs.ref }}'
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "비교할 base 커밋이 없다 ($BASE) — 검사를 건너뛴다."
            exit 0
          fi
          ./scripts/check-migration-order.sh "$BASE"

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle 배포판·의존성·빌드 캐시를 재사용한다.
      # gradlew 는 git 에 실행 비트(100755)로 들어 있어 별도 chmod 스텝이 필요 없다.
      - uses: gradle/actions/setup-gradle@v4

      # build + test 에 4장 ArchUnit(Layer/Module) 테스트와 8장 JaCoCo 100% 게이트가 모두 포함된다.
      # 아키텍처 위반·커버리지 미달 시 이 스텝에서 빌드가 실패한다.
      # 로컬에서 동일한 검증: `./gradlew ciCheck` (README 참고)
      - name: Build, test, coverage & architecture verification
        run: ./gradlew build test jacocoTestCoverageVerification

      # 실패했을 때야말로 리포트가 필요하다. 커버리지 미달 로그는
      # "ratio is 0.99, but expected minimum is 1.00" 한 줄뿐이라 어느 클래스인지 알 수 없다(이슈 #40).
      - name: Upload test & coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            engine/build/reports/tests/
            engine/build/reports/jacoco/
            app/build/reports/tests/
            app/build/reports/jacoco/
