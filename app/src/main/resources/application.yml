# ── 공통 설정 (모든 환경 공유) ─────────────────────────────────────────────
# 환경별로 다른 부분(DB 접속·프론트 오리진)만 application-dev / application-prod 로 분리한다.
# 활성 프로파일: 기본 dev, Render 는 SPRING_PROFILES_ACTIVE=prod 를 주입해 prod 로 뜬다.

# 서버 바인딩 — Render 는 PORT 환경변수를 주입한다(기본 10000). 로컬은 8080 로 폴백.
# 0.0.0.0 바인딩이어야 컨테이너 외부에서 접근 가능하다.
server:
  port: ${PORT:8080}
  address: 0.0.0.0

# 인증 (이슈 #9) — JWT 액세스/리프레시 토큰. Spring Security 미사용.
# jwt-secret 은 운영에서 반드시 JWT_SECRET 환경변수로 주입한다(HS256, 32바이트 이상).
# 로컬 폴백은 개발 전용 값이므로 그대로 배포하지 않는다.
# access 30분(1800s)·refresh 14일(1209600s) — NFR-SE-02.

app:
  # 온보딩 (이슈 #108) — 가입 직후 샘플 자산 시드.
  # 원래 온보딩 2단계는 금융기관에서 사용자의 실제 자산을 불러와야 하지만, MVP 범위에 실연동이 없다
  # (API 명세 §241 "마이데이터·증권사 연동은 구현하지 않는다"). 그동안 가입 계정을 빈 상태로 두면
  # 온보딩 2단계부터 홈·X-ray·플랜까지 전부 빈 화면이 되므로, 데모 계정과 같은 샘플을 임시로 넣는다.
  # 실연동이 도착하면 이 플래그와 AuthService 의 호출을 함께 걷어낸다.
  # 데모 계정(POST /auth/demo)의 시드는 이 플래그와 무관하게 항상 들어간다 — 그쪽은 제품 기능이다.
  onboarding:
    seed-sample-assets-on-signup: ${SEED_SAMPLE_ASSETS_ON_SIGNUP:true}
  # 관리자 콘솔 (이슈 #111) — /api/v1/admin/** 접근 권한.
  # bootstrap-email 이 비어 있으면 AdminBootstrapRunner 빈 자체가 만들어지지 않는다(기본 상태).
  # 값은 반드시 환경변수로 준다 — 관리자 비밀번호를 레포에 커밋하지 않기 위해서다.
  #   ADMIN_EMAIL=admin@example.com ADMIN_PASSWORD=... ./gradlew :app:bootRun
  # 계정이 이미 있으면 role 만 ADMIN 으로 올리고 비밀번호는 건드리지 않는다.
  admin:
    bootstrap-email: ${ADMIN_EMAIL:}
    bootstrap-password: ${ADMIN_PASSWORD:}
  auth:
    jwt-secret: ${JWT_SECRET:local-dev-insecure-jwt-secret-please-override-in-prod-0123456789}
    access-token-ttl-seconds: 1800
    refresh-token-ttl-seconds: 1209600
  # 외부 데이터 인프라 (이슈 #12) — ECOS(환율)·FRED(거시지표)
  # API 키는 운영에서 반드시 환경변수(ECOS_API_KEY / FRED_API_KEY)로 주입한다. 로컬 폴백 없음.
  # NFR-DT-02: 환율=ECOS, 거시지표=FRED 를 1차 출처로 한다.
  external:
    ecos:
      base-url: https://ecos.bok.or.kr/api
      api-key: ${ECOS_API_KEY:}
      stat-code: 731Y001   # 원/미달러 등 주요통화 대원화환율(일)
      item-codes:
        USD_KRW: "0000001"
        JPY_KRW: "0000002"   # 100엔당
        EUR_KRW: "0000003"
        CNY_KRW: "0000053"
      # 환율 적재 배치 (이슈 #111, ERD 2단계). 매일 ECOS 를 친다.
      # EcosProperties(record) 에는 넣지 않는다: @ConditionalOnProperty 와 @Scheduled 는
      # Environment 를 직접 읽으므로 바인딩이 필요 없고, record 컴포넌트를 늘리면 그 생성자를
      # 직접 호출하는 테스트들이 함께 깨진다.
      #
      # 기본값을 true 로 바꿨다 (이슈 #116). 계산 경로가 fx_rates 를 1차 출처로 읽게 됐는데,
      # 배치가 꺼져 있으면 그 표는 영원히 불완전해 읽기 경로가 매번 실시간 조회로 되돌아간다.
      # 즉 #111·#116 이 만든 이득(배포 후 5년치 재조회 회피·ECOS 장애 내성)이 하나도 실현되지
      # 않는다. 끄고 싶으면 ECOS_INGEST_SCHEDULE_ENABLED=false 로 명시한다 — 기본이 꺼짐이면
      # "켜는 것을 잊었다" 가 조용한 성능 저하로 남고, 기본이 켜짐이면 끄는 쪽이 의도가 된다.
      ingest-schedule-enabled: ${ECOS_INGEST_SCHEDULE_ENABLED:true}
      ingest-cron: ${ECOS_INGEST_CRON:0 30 9 * * *}   # KST 09:30 — ECOS 고시 이후
      ingest-lookback-days: ${ECOS_INGEST_LOOKBACK_DAYS:14}
    fred:
      base-url: https://api.stlouisfed.org/fred
      api-key: ${FRED_API_KEY:}
    # AI 서술(narrate) 경로 — Anthropic Claude (이슈 #73, 값 노출은 이슈 #123).
    # enabled=false(기본)면 ClaudeAiProvider 빈이 만들어지지 않고 MockAiProvider 의 템플릿 문장이 나간다.
    # true 로 켤 때 api-key 가 비어 있으면 기동 시점에 실패한다 — 켰다고 믿는 채로 템플릿이 나가는 것보다 낫다.
    # 아래 값은 전부 환경변수로 덮어쓴다(#123) — 여기 적힌 기본값은 이슈 #73 확정값 그대로이고,
    # 얼마로 올릴지는 #124 다. SDK 재시도 0 은 코드에 고정이다(AnthropicConfig).
    # 계산에는 관여하지 않는다(CLAUDE.md §1) — 검증된 facts 를 문장으로 옮기는 데만 쓴다.
    anthropic:
      enabled: ${ANTHROPIC_ENABLED:false}
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${ANTHROPIC_MODEL:claude-opus-5}
      max-tokens: ${ANTHROPIC_MAX_TOKENS:1024}
      # 요청 1건당 타임아웃.
      request-timeout: ${ANTHROPIC_REQUEST_TIMEOUT:5s}
      # 재시도까지 포함한 서술 1건의 총예산. AiService 가 이 값을 읽는다 —
      # request-timeout 만 올리고 이 값을 그대로 두면 두 번째 시도가 영영 오지 않는다(#123).
      total-budget: ${ANTHROPIC_TOTAL_BUDGET:8s}
      # AI 추출(extract) 경로 — 비정형 원문 → econ_events (이슈 #74). narrate(위 forecast_summary)와는
      # 입력·실패 처리가 다른 별도 경로다. 대상 뉴스 소스가 아직 팀 결정 전이고(MockRawArticleSource
      # 는 시연용 자리표시자), 배치가 기본으로 실 API 를 호출하면 안 되므로 셋 다 기본 꺼짐이다.
      # extract-enabled=false 면 ClaudeEconEventExtractor 빈이 만들어지지 않고
      # NoOpEconEventExtractor 가 빈 배열을 돌려준다.
      # 전제조건 — extract-enabled=true 는 enabled=true 를 요구한다. 추출기가 쓰는 ClaudeMessageClient
      # 는 enabled=true 일 때만 만들어지므로, 이 하나만 켜면 기동이 실패한다. 어긋나면 그 이유를
      # 말하고 실패한다(AnthropicProperties, #123).
      extract-enabled: ${ANTHROPIC_EXTRACT_ENABLED:false}
      # 추출기가 켜져 있어도 배치 스케줄은 별도로 켜야 한다 — 수동/테스트 호출과 상시 배치를
      # 분리해 둔다.
      extract-schedule-enabled: ${ANTHROPIC_EXTRACT_SCHEDULE_ENABLED:false}
      # 스케줄러 주기(Spring cron 표현식). 기본은 매시 정각.
      extract-cron: ${ANTHROPIC_EXTRACT_CRON:0 0 * * * *}

spring:
  application:
    name: divurve-api

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # 전역 SNAKE_CASE 직렬화 — DTO 는 camelCase 로 작성하고 직렬화 시 자동 변환 (문서 5장)
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

  # DB 드라이버는 공통, 접속 정보(url/username/password)는 프로파일별로 지정
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      # 연결이 안 열릴 때 무한 대기(hang) 대신 명확한 예외로 빠르게 실패시킨다.
      connection-timeout: 10000
      initialization-fail-timeout: 10000

  jpa:
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway 가 관리한다
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  # DB 마이그레이션 (문서 2장 — Flyway 제안)
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true


# API 문서 (문서 6장)
springdoc:
  swagger-ui:
    path: /swagger-ui/index.html
  api-docs:
    path: /v3/api-docs


# 헬스체크 (이슈 #145) — Render 무료 티어 슬립 방지 핑의 대상.
# health 만 노출한다. metrics·env·beans 등은 인증 없이 열리면 내부 구조가 그대로 새어나가고,
# 이 레포는 Spring Security 를 쓰지 않아 actuator 경로에 인증을 걸 수단이 없다
# (WebAuthConfig 의 인터셉터는 /api/** 에만 붙는다).
#
# probes 를 켜면 health 아래에 liveness·readiness 그룹이 생긴다.
#   /actuator/health            전체 — DB 포함. DB 가 죽으면 503
#   /actuator/health/liveness   "JVM 이 살아 있다" 만 — 외부 의존성 미포함, 항상 200
# 슬립 방지 워크플로는 liveness 를 찌른다. 목적이 "인스턴스를 깨우는 것"이라서,
# DB 장애로 503 이 나면 핑은 성공했는데 워크플로만 빨간불이 되는 오탐이 된다.
# DB 를 포함한 진짜 상태 확인이 필요하면 /actuator/health 를 따로 본다.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
